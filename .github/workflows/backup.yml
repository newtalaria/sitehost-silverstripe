# Back up one SiteHost container and keep the snapshot directory name.
#
# Called by a site repository. No git checkout, dev/build, or source maps.
# The pin file stays on the container so the id can be copied into a restore.

name: Back up SiteHost

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment name for this container.
        type: string
        required: true
    secrets:
      SITEHOST_SSH_PRIVATE_KEY:
        description: Actions login key for the container SSH user.
        required: false
      SITEHOST_API_KEY:
        description: SiteHost API key with no IP allowlist.
        required: false
    outputs:
      snapshot_id:
        description: Directory name of the SiteHost container backup for this run.
        value: ${{ jobs.backup.outputs.snapshot_id }}

permissions:
  contents: read

concurrency:
  group: sitehost-silverstripe-${{ github.repository }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Validate environment name
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          if [[ ! "$ENVIRONMENT" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,62}$ ]]; then
            echo "environment must match [A-Za-z0-9][A-Za-z0-9_.-]{0,62}." >&2
            exit 1
          fi

  backup:
    needs: guard
    if: always() && needs.guard.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ inputs.environment }}
    outputs:
      snapshot_id: ${{ steps.snapshot.outputs.snapshot_id }}
    env:
      SITEHOST_APP_PATH: ${{ vars.SITEHOST_APP_PATH || '/container/application' }}
      SITEHOST_BACKUP_ROOT: ${{ vars.SITEHOST_BACKUP_ROOT || '/container/backups/containers' }}
      SITEHOST_CLIENT_ID: ${{ vars.SITEHOST_CLIENT_ID }}
      SITEHOST_SERVER: ${{ vars.SITEHOST_SERVER }}
      SITEHOST_CONTAINER: ${{ vars.SITEHOST_CONTAINER || vars.SITEHOST_STACK }}
      SITEHOST_STACK: ${{ vars.SITEHOST_STACK }}
      SITEHOST_SERVICE: ${{ vars.SITEHOST_SERVICE || vars.SITEHOST_CONTAINER || vars.SITEHOST_STACK }}
      SITEHOST_SITE_URL: ${{ vars.SITEHOST_SITE_URL }}
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}

    steps:
      - name: Normalize configuration
        uses: newtalaria/sitehost-silverstripe/actions/ssh@v1
        env:
          SITEHOST_SSH_PORT_RAW: ${{ vars.SITEHOST_SSH_PORT }}
          SITEHOST_SSH_HOST_RAW: ${{ vars.SITEHOST_SSH_HOST }}
          SITEHOST_SSH_USER_RAW: ${{ vars.SITEHOST_SSH_USER }}
          SITEHOST_SSH_HOST_FINGERPRINT_RAW: ${{ vars.SITEHOST_SSH_HOST_FINGERPRINT }}
          SITEHOST_SSH_PRIVATE_KEY_RAW: ${{ secrets.SITEHOST_SSH_PRIVATE_KEY || vars.SITEHOST_SSH_PRIVATE_KEY }}
          SITEHOST_API_KEY_RAW: ${{ secrets.SITEHOST_API_KEY || vars.SITEHOST_API_KEY }}
        with:
          script: configure-env.sh

      - name: Check SSH configuration
        uses: newtalaria/sitehost-silverstripe/actions/ssh@v1
        env:
          REQUIRE_CONFIG: operate
        with:
          script: require-config.sh

      - name: Check SiteHost API configuration
        uses: newtalaria/sitehost-silverstripe/actions/ssh@v1
        env:
          REQUIRE_CONFIG: api
        with:
          script: require-config.sh

      - name: Record existing snapshots
        uses: newtalaria/sitehost-silverstripe/actions/ssh@v1
        env:
          SNAPSHOT_MODE: record
        with:
          script: remote-snapshots.sh
          command_timeout: 5m
          env_names: SITEHOST_BACKUP_ROOT SNAPSHOT_MODE

      - name: Start container backup
        id: backup
        uses: newtalaria/sitehost-silverstripe/actions/ssh@v1
        env:
          BACKUP_LABEL: backup-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          script: sitehost-api.sh
          api_command: backup

      - name: Wait for container backup
        uses: newtalaria/sitehost-silverstripe/actions/ssh@v1
        with:
          script: sitehost-api.sh
          api_command: poll-job
          api_job_type: ${{ steps.backup.outputs.job_type }}
          api_job_id: ${{ steps.backup.outputs.job_id }}
          api_timeout: "2700"

      - name: Pin new snapshot
        id: pin-snapshot
        uses: newtalaria/sitehost-silverstripe/actions/ssh@v1
        env:
          SNAPSHOT_MODE: pin
        with:
          script: remote-snapshots.sh
          command_timeout: 5m
          capture_stdout: "true"
          env_names: SITEHOST_BACKUP_ROOT SNAPSHOT_MODE

      - name: Record snapshot id
        id: snapshot
        env:
          PIN_STDOUT: ${{ steps.pin-snapshot.outputs.stdout }}
        run: |
          set -euo pipefail
          id="$(printf '%s\n' "$PIN_STDOUT" | tr -d '\r' | sed -n 's/^snapshot_id=//p' | tail -n 1)"
          if [[ ! "$id" =~ ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,180}$ || "$id" == "latest" ]]; then
            echo "The SiteHost backup did not report a snapshot directory name." >&2
            printf '%s\n' "$PIN_STDOUT" >&2
            exit 1
          fi
          echo "snapshot_id=${id}" >> "$GITHUB_OUTPUT"
          echo "SiteHost snapshot id: ${id}"
          {
            echo "### SiteHost container backup"
            echo
            echo "Container \`${SITEHOST_CONTAINER}\`."
            echo
            echo "Snapshot id \`${id}\`."
            echo
            echo "The directory stays under \`${SITEHOST_BACKUP_ROOT%/}/${id}\`."
            echo
            echo "The pin file on the container is left in place. Paste this id into a restore."
          } >> "$GITHUB_STEP_SUMMARY"
